name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 数据校验
        run: python3 scripts/validate.py

      - name: 课标映射严格模式（仅报告）
        continue-on-error: true
        env:
          STRICT_STANDARDS: "1"
        run: python3 scripts/validate.py

      - name: 题库答案核验
        run: python3 scripts/verify_questions.py --report /tmp/cn-math-taxonomy-verification-report.json

      - name: 题目示意图检查
        run: python3 scripts/check_figures.py

      - name: 初中道法安全测试
        run: python3 tests/test_jmor_safety.py

      - name: 初中英语待核分类
        run: python3 tests/test_enj_pending.py

      - name: CI 工作流测试
        run: node tests/test_ci_workflow.js

      - name: 题目 ID 格式测试
        run: node tests/test_question_ids.js

      - name: 初中语文重建保留高中跨段边
        run: python3 tests/test_zhj_keep_hs.py

      - name: verify 表达式精确求值
        run: python3 tests/test_verify_exact.py

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 数据校验
        run: python3 scripts/validate.py

      - name: 课标映射严格模式（仅报告）
        continue-on-error: true
        env:
          STRICT_STANDARDS: "1"
        run: python3 scripts/validate.py

      - name: 题库答案核验
        run: python3 scripts/verify_questions.py --report /tmp/cn-math-taxonomy-verification-report.json

      - name: 题目示意图检查
        run: python3 scripts/check_figures.py

      - name: 初中道法安全测试
        run: python3 tests/test_jmor_safety.py

      - name: 初中英语待核分类
        run: python3 tests/test_enj_pending.py

      - name: 初中道法前端测试
        run: node tests/test_jmor_frontend.js

      - name: CI 工作流测试
        run: node tests/test_ci_workflow.js

      - name: 诊断引擎测试
        run: node tests/test_engine.js

      - name: 盲区汇总测试
        run: node tests/test_blindspots.js

      - name: 档案备份恢复测试
        run: node tests/test_children.js

      - name: 错题本存储测试
        run: node tests/test_wrongbook.js

      - name: 错题到期复测测试
        run: node tests/test_wrongbook_review.js

      - name: 期末补漏计划测试
        run: node tests/test_finals.js

      - name: 云同步合并与引擎测试
        run: node tests/test_sync.js

      - name: 账号与同步 API 测试
        run: node tests/test_api.js

      - name: 每周学习周报测试
        run: node tests/test_digest.js

      - name: 知识点静态页测试
        run: node tests/test_kp_pages.js

      - name: 题目 ID 格式测试
        run: node tests/test_question_ids.js

      - name: 题干改写历史兼容测试
        run: node tests/test_stem_compat.js

      - name: 诊断报错链接
        run: node tests/test_report_link.js

      - name: 首页题库异步加载
        run: node tests/test_home.js

      - name: 题库按学科拆分对账
        run: node tests/test_questions_split.js

      - name: 登录体验静态检查
        run: node tests/test_login_ux.js

      - name: 页面脚本缓存测试
        run: node tests/test_pages_script_cache.js

      - name: 数据修补批回归（科学锚定、两道单题、历史诊断题量）
        run: node tests/test_data_patch_batch.js

      - name: 薄弱科目补强批回归（高中地理、生物、历史与历史先修边）
        run: node tests/test_senior_batch.js

      - name: 英语每日一句：句子表与动画模板
        run: node tests/test_english_data.js

      - name: 英语每日一句：解锁、复习、打卡判定
        run: node tests/test_english_logic.js

      - name: 英语每日一句：逐词慢读与点词单读
        run: node tests/test_english_slowread.js

      - name: 学习打卡与连续天数
        run: node tests/test_activity.js

      - name: 英语每日一句与学习打卡的云同步合并、打卡接入点
        run: node tests/test_english_sync.js

      - name: 高中语文五册
        run: node tests/test_zh_hs.js

      - name: 高中思想政治七册
        run: node tests/test_pol_hs.js

      - name: 初中语文重建保留高中跨段边
        run: python3 tests/test_zhj_keep_hs.py

name: 功能建议
description: 题库数据、知识点与先修关系、版本映射或文档的改进想法（站点与诊断工具的功能建议不在本仓处理）
title: "[建议] "
labels: ["功能建议"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 想解决什么问题
      description: 用一两句话说清楚场景和痛点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望怎么改（涉及的学科/册次、数据字段、文档位置等）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 题库数据
        - 知识点与先修关系
        - 教材版本映射
        - 课标条目
        - 文档 / README
        - 其他
    validations:
      required: true
  - type: textarea
    id: extras
    attributes:
      label: 其他补充
      description: 参考链接、竞品截图等（可选）
    validations:
      required: false
